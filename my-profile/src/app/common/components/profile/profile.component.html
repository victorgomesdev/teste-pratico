<div
    class="flex flex-col w-full px-5 py-4 bg-slate-100 rounded-md border border-gray-400 h-[90vh] overflow-y-scroll gap-7">
    <div class="w-full flex flex-row justify-between items-center">
        <h2 class="text-slate-800 text-2xl font-semibold">Perfil do usuário</h2>
        <div class="flex flex-col gap-3">
            <button (click)="closeProfile()"
                class="md:hidden border-2 border-red-500 rounded-md text-red-500 px-2 py-1 hover:bg-red-500 hover:text-background transition-colors duration-300 cursor-pointer text-sm">
                CANCELAR
            </button>
            <button (click)="editUser()"
                class="border-2 border-primary rounded-md text-primary px-2 py-1 hover:bg-primary hover:text-background transition-colors duration-300 cursor-pointer text-sm"><i
                    class="pi pi-pencil" style="font-size: 0.8rem;"></i> EDITAR</button>
        </div>
    </div>
    <div class="flex flex-col md:flex-row w-full border-l-6 border-primary px-3 gap-7">
        <div class="w-36 h-32 overflow-hidden rounded-full">
            <img [src]="user()?.base64Image ? user()?.base64Image : 'assets/user.png'" alt="image"
                class="h-full w-full object-cover">
        </div>
        <div class="flex flex-col w-full gap-3">
            <h2 class="text-slate-800 text-xl font-semibold">Dados pessoais</h2>
            <div class="grid grid-cols-2 w-full gap-4">
                <div class="flex flex-col col-span-1">
                    <span class="text-sm text-paragraph"><i class="pi pi-user" style="font-size: 0.7rem;"></i>
                        Nome:</span>
                    <span class="text-slate-800">{{user()?.name}}</span>
                </div>
                <div class="flex flex-col col-span-1">
                    <span class="text-sm text-paragraph"><i class="pi pi-gift" style="font-size: 0.7rem;"></i>
                        Idade:</span>
                    <span class="text-slate-800">{{user()?.dateOfBirth | age}} (anos)</span>
                </div>
                <div class="flex flex-col col-span-1">
                    <span class="text-sm text-paragraph"><i class="pi pi-envelope" style="font-size: 0.7rem;"></i>
                        Email:</span>
                    <span class="text-slate-800">{{user()?.email}}</span>
                </div>
                <div class="flex flex-col col-span-2">
                    <span class="text-sm text-paragraph"><i class="pi pi-map-marker" style="font-size: 0.7rem;"></i>
                        Endereço completo:</span>
                    <span class="text-slate-800">{{user()?.address?.street}}</span>
                </div>
            </div>
        </div>
    </div>
    <div class="flex flex-col w-full border-l-6 border-primary px-3 gap-5">
        <h2 class="text-slate-800 text-xl font-semibold">Biografia</h2>
        <p-editor [innerHtml]="user()?.biography" [readonly]="true" [style]="{ height: '320px' }" />

    </div>
</div>
