<div
    [ngClass]="{'border-l-6 border-primary': isSelected,}"
    class="w-full flex flex-row justify-between p-2 gap-2 items-center bg-slate-200 border-b border-gray-400 cursor-pointer"
    (click)="handleClick()"
    >
    <div class="w-16 h-14 rounded-full overflow-hidden">
        <img [src]="user()?.base64Image ? user()?.base64Image : 'assets/user.png'" class="object-cover">
    </div>
    <div class="w-full flex flex-col">
        <h3 [ngClass]="{'text-primary': isSelected, 'text-slate-800': !isSelected}" class="font-semibold text-lg">{{user()?.name}}</h3>
        <span class="text-sm text-slate-700"><i class="pi pi-envelope" style="font-size: 0.7rem;"></i>
            {{user()?.email}}</span>
    </div>
</div>
